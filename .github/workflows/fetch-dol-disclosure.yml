name: Fetch DOL OFLC Disclosure Data

on:
  push:
    branches: [ main ]
  schedule:
    # Run quarterly on the 5th of Jan, Apr, Jul, Oct at 12:00 UTC
    - cron: '0 12 5 1,4,7,10 *'
  workflow_dispatch:

jobs:
  fetch-dol-disclosure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DOL Disclosure Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python scrapers/dol_disclosure.py

      - name: Upload Raw Snapshot Artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: raw-dol-disclosure
          path: raw/dol_disclosure/
          retention-days: 90
