name: Scrape Visa Bulletin

on:
  schedule:
    # Run weekly on weekdays between 8th and 28th of every month at 12:00 UTC
    - cron: '0 12 8-28 * 1-5'
  workflow_dispatch:

jobs:
  scrape-visa-bulletin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Visa Bulletin Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python scrapers/visa_bulletin.py

      - name: Upload Raw Snapshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-visa-bulletin
          path: raw/visa_bulletin/
          retention-days: 90
