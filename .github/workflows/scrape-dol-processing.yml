name: Scrape DOL Processing Times

on:
  push:
    branches: [ main ]
  schedule:
    # Run monthly on the 1st of every month at 12:00 UTC
    - cron: '0 12 1 * *'
  workflow_dispatch:

jobs:
  scrape-dol-processing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DOL Processing Times Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          python scrapers/dol_processing_times.py

      - name: Upload Raw Snapshot Artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: raw-dol-processing
          path: raw/dol_processing/
          retention-days: 90
